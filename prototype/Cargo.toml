[package]
name = "sshnesh-preview"
version = "0.1.2"
edition = "2021"

[lib]
name = "sshnesh_preview"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop-ui"]
desktop-ui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager",
  "dep:tauri-plugin-deep-link", "dep:tauri-plugin-opener", "dep:reqwest", "dep:getrandom",
  "dep:ring", "dep:scrypt"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rand = "0.10"
base64 = "0.22"
sha2 = "0.10"

tauri-plugin-opener = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"], optional = true }
getrandom = { version = "0.4", optional = true }
ring = { version = "0.17", optional = true }
scrypt = { version = "0.12", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"
tauri-plugin-deep-link = { version = "2", optional = true }
[profile.release]
strip = true
lto = "thin"
opt-level = "s"
